name: RIDGE CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ridge
          POSTGRES_USER: ridge
          POSTGRES_PASSWORD: ridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ridge -d ridge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ridge:ridge_test@localhost:5432/ridge
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret
      DB_MIGRATE_ON_START: "false"
      DB_SEED_ON_START: "false"
      INGESTION_ENABLED: "false"
      SCORING_ENABLED: "false"
      ALERTS_ENABLED: "false"
      ML_SERVICE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - name: Run tests
        working-directory: server
        run: npm test

  test-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - name: Install dependencies
        working-directory: ml-service
        run: pip install -r requirements.txt
      - name: Train model (if needed)
        working-directory: ml-service
        run: python -m src.train || true
      - name: Run pytest
        working-directory: ml-service
        run: pytest -v

  build:
    needs: [test-server, test-ml]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build
