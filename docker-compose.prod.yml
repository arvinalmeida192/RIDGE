services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ridge
      POSTGRES_USER: ridge
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridge -d ridge"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ridge-net

  redis:
    image: redis:7-alpine
    container_name: ridge-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - ridge-net

  ml-service:
    build:
      context: ./ml-service
      target: production
    container_name: ridge-ml
    restart: unless-stopped
    environment:
      MODEL_DIR: /app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - ridge-net

  server:
    build:
      context: ./server
      target: production
    container_name: ridge-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://ridge:${DB_PASSWORD}@postgres:5432/ridge
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
      DB_MIGRATE_ON_START: "true"
      DB_SEED_ON_START: "false"
      INGESTION_ENABLED: "true"
      SCORING_ENABLED: "true"
      ALERTS_ENABLED: "true"
      NOTIFICATIONS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - ridge-net

  nginx:
    image: nginx:1.27-alpine
    container_name: ridge-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    networks:
      - ridge-net

volumes:
  pgdata:
  redisdata:

networks:
  ridge-net:
    driver: bridge
